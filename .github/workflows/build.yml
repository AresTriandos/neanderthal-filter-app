name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to TestFlight
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build iOS app
        run: eas build --platform ios --profile production --wait

      - name: Submit to TestFlight
        run: eas submit --platform ios --latest --wait

      - name: Notify on success
        if: success()
        run: echo "✅ Build and deployment successful!"

      - name: Notify on failure
        if: failure()
        run: echo "❌ Build or deployment failed"
